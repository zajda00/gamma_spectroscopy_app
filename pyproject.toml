[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decay-scheme-app"
version = "0.1.0"
description = "Desktop app for nuclear decay-scheme preparation, ABF and approximate log ft analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app_*"]
