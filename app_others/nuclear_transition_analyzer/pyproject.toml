[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-transition-analyzer"
version = "0.1.0"
description = "Practical analysis tool for gamma-transition multipolarities, Weisskopf ratios and spin-parity consistency."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Martyna Kudla workspace"}]
dependencies = ["pandas>=2.0", "numpy>=1.24", "streamlit>=1.32"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nuclear-transition-analyzer = "nuclear_transition_analyzer.cli:main"
